services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3001"
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3001/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  dokploy-network:
    external: true
